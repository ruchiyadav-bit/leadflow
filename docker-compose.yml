version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: leadflow-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      - PHP_MEMORY_LIMIT=512M
    networks:
      - leadflow

  nginx:
    image: nginx:1.27-alpine
    container_name: leadflow-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - leadflow

  mysql:
    image: mysql:8.0
    container_name: leadflow-mysql
    command: --default-authentication-plugin=caching_sha2_password --innodb-buffer-pool-size=512M
    environment:
      MYSQL_DATABASE: leadflow
      MYSQL_USER: leadflow
      MYSQL_PASSWORD: leadflow_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - leadflow

  redis:
    image: redis:7-alpine
    container_name: leadflow-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - leadflow

volumes:
  mysql_data:
  redis_data:

networks:
  leadflow:
    driver: bridge
